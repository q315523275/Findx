<!doctype html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0}body{background:#fff}svg{display:block}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="arrowhead" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0f766e"/></marker></defs>
<text x="60" y="54" font-size="30" fill="#0f172a" font-weight="700" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">部署拓扑示例：2 纯调度 + 3 执行 + 1 库</text>
<text x="60" y="84" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">同构部署、租约互斥；调度端只管“何时 / 谁跑”，执行端只管“能不能跑”</text>
<rect x="60" y="140" width="300" height="84" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
<text x="76" y="167" font-size="15" fill="#0f172a" font-weight="600" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">运维 / 内部系统</text>
<text x="76" y="192" font-size="12" fill="#475569" font-weight="normal" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">运维平台 · 手动触发 · 执行记录查询</text>
<text x="378" y="170" font-size="11.5" fill="#64748b" font-weight="600" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">HTTPS + Token</text>
<line x1="360" y1="180" x2="468" y2="180" stroke="#0f766e" stroke-width="2" marker-end="url(#arrowhead)"/>
<rect x="44" y="240" width="700" height="150" rx="14" fill="none" stroke="#0f766e" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="58" y="262" font-size="12.5" fill="#0f766e" font-weight="600" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">调度层：同构节点，全开 SchedulerEnabled（谁当主由租约决定）</text>
<rect x="60" y="300" width="300" height="76" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.3"/>
<text x="76" y="327" font-size="15" fill="#0f172a" font-weight="600" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">Node-A · 当前主</text>
<text x="76" y="352" font-size="12" fill="#475569" font-weight="normal" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">SchedulerEnabled=true / WorkerEnabled=false</text>
<text x="76" y="373" font-size="12" fill="#475569" font-weight="normal" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">扫描 · 领取 · 投递 · 结果收敛 · 管理面</text>
<rect x="400" y="300" width="300" height="76" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.3"/>
<text x="416" y="327" font-size="15" fill="#0f172a" font-weight="600" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">Node-B · 备节点</text>
<text x="416" y="352" font-size="12" fill="#475569" font-weight="normal" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">同样参与抢租约，未持有时只待命</text>
<text x="416" y="373" font-size="12" fill="#475569" font-weight="normal" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">主机失联超过 TTL 15s 后接替</text>
<line x1="230" y1="224" x2="230" y2="298" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="210" y1="420" x2="900" y2="420" stroke="#0f766e" stroke-width="2" marker-end="url(#arrowhead)"/>
<text x="520" y="410" font-size="11" fill="#0f766e" font-weight="600" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">① 投递 execute / kill（任一主 → 任一具备该任务的执行节点）</text>
<line x1="900" y1="446" x2="210" y2="446" stroke="#475569" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowhead)"/>
<text x="540" y="464" font-size="11" fill="#475569" font-weight="600" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">② 结果 result · 日志 logs · 心跳 beat（执行 → 当前主）</text>
<rect x="44" y="470" width="1500" height="154" rx="14" fill="none" stroke="#1d4ed8" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="58" y="492" font-size="12.5" fill="#1d4ed8" font-weight="600" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">执行层：各节点承载的 IJob 不同，心跳上报能力清单（60s 重扫）</text>
<rect x="60" y="528" width="290" height="76" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="76" y="555" font-size="15" fill="#0f172a" font-weight="600" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">Node-W1 · 引物</text>
<text x="76" y="580" font-size="12" fill="#475569" font-weight="normal" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">引物设计 / 通用任务 IJob</text>
<text x="76" y="601" font-size="12" fill="#475569" font-weight="normal" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">心跳 10s，能力 TTL 45s 判活</text>
<rect x="380" y="528" width="290" height="76" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="396" y="555" font-size="15" fill="#0f172a" font-weight="600" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">Node-W2 · 测序</text>
<text x="396" y="580" font-size="12" fill="#475569" font-weight="normal" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">测序分析 / ab1 分拣 IJob</text>
<text x="396" y="601" font-size="12" fill="#475569" font-weight="normal" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">执行队列并发 8，日志分片上报</text>
<rect x="700" y="528" width="290" height="76" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="716" y="555" font-size="15" fill="#0f172a" font-weight="600" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">Node-W3 · 报表</text>
<text x="716" y="580" font-size="12" fill="#475569" font-weight="normal" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">报表 / 数据同步 IJob</text>
<text x="716" y="601" font-size="12" fill="#475569" font-weight="normal" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">可与 W1/W2 互为备份能力</text>
<rect x="44" y="652" width="1500" height="122" rx="14" fill="none" stroke="#b45309" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="58" y="674" font-size="12.5" fill="#b45309" font-weight="600" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">数据层：MySQL 单库（数据源 jobs），仅调度节点读写（租约/节点注册/账本/日志明细）；执行节点无数据库连接，登记/结果/日志走协议</text>
<rect x="66" y="692" width="288" height="58" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
<text x="80" y="724" font-size="13.5" fill="#92400e" font-weight="700" text-anchor="start" font-family="Menlo, monospace">scheduler_master</text>
<rect x="382" y="692" width="288" height="58" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
<text x="396" y="724" font-size="13.5" fill="#92400e" font-weight="700" text-anchor="start" font-family="Menlo, monospace">scheduler_worker</text>
<rect x="698" y="692" width="288" height="58" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
<text x="712" y="724" font-size="13.5" fill="#92400e" font-weight="700" text-anchor="start" font-family="Menlo, monospace">scheduler_execution</text>
<rect x="1014" y="692" width="288" height="58" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
<text x="1028" y="724" font-size="13.5" fill="#92400e" font-weight="700" text-anchor="start" font-family="Menlo, monospace">scheduler_execution_log</text>
<line x1="210" y1="376" x2="210" y2="650" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.5"/>
<line x1="530" y1="376" x2="530" y2="650" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.5"/>
<rect x="1060" y="280" width="480" height="86" rx="10" fill="#fcfdfe" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="1076" y="306" font-size="14" fill="#0f172a" font-weight="600" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">故障转移</text>
<text x="1076" y="330" font-size="11.5" fill="#475569" font-weight="normal" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">主失联超过 15s，备节点通过租约接替；在途执行由账本接管，不依赖进程内存。</text>
<rect x="1060" y="384" width="480" height="86" rx="10" fill="#fcfdfe" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="1076" y="410" font-size="14" fill="#0f172a" font-weight="600" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">同进程形态</text>
<text x="1076" y="434" font-size="11.5" fill="#475569" font-weight="normal" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">小规模可 Scheduler + Worker 同开：省机器，但执行与管理面共享同一进程。</text>
<rect x="1060" y="488" width="480" height="86" rx="10" fill="#fcfdfe" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="1076" y="514" font-size="14" fill="#0f172a" font-weight="600" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">扩容执行节点</text>
<text x="1076" y="538" font-size="11.5" fill="#475569" font-weight="normal" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">新增节点只要部署 IJob 实现并开启 WorkerEnabled，心跳上报能力后即可被调度。</text>
