<text x="60" y="728" font-size="13" fill="#b45309" font-weight="700" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">⑧ 存储：NotifyLogStore → 表 notify_logs（EntityExtension DataSource=Notify）</text>
<text x="60" y="756" font-size="11" fill="#334155" font-weight="normal" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">字段：Channel / Title / Content(2000) / Receivers(500) / TemplateId / Status / Success / ErrorMessage(500) / BusinessKey / NodeName / Payload(JSON 全长) / SendTime / ElapsedMs</text>
<text x="60" y="782" font-size="11" fill="#334155" font-weight="normal" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">★ 落库失败只记 Warning：通知已发出，日志写失败不反噬主流程；★ Payload 是完整消息快照（可重放），但当前没有自动重试</text>
<text x="60" y="808" font-size="11" fill="#334155" font-weight="normal" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">★ 只有一次 INSERT：同步路径 = 发送返回后写；异步路径 = 消费线程 Apply 之后写。没有「发送中」行，队列在途消息无法从库观测</text>
<text x="60" y="838" font-size="11" fill="#334155" font-weight="normal" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">★ 业务拿到的是 Id：QueueAsync 先把主键生成好并返回，日志行随后落库，可用于按业务键反查</text>
<text x="60" y="872" font-size="11" fill="#b45309" font-weight="600" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">边界：内存队列 + 单次发送 → 进程崩溃时未发送的消息丢失；通道失败只记日志不重试。若要「不丢 + 可重试」，需要在业务侧落库补偿或换持久化队列</text>
</svg>