<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:#fff}svg{display:block}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="910" viewBox="0 0 1600 910" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs>
<marker id="arrowhead" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0f766e"/></marker>
<marker id="arrowheadgray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/></marker>
</defs>
<text x="60" y="54" font-size="30" fill="#0f172a" font-weight="700" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">Findx 分布式调度 · 执行状态机与重试 / 死信</text>
<text x="60" y="84" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">一次执行从领取到终结的所有迁移路径；任务侧退避重试、死信隔离与人工放行</text>
<rect x="44" y="112" width="956" height="524" rx="14" fill="none" stroke="#0f766e" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="60" y="136" font-size="13.5" fill="#0f766e" font-weight="600" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">一次执行的状态机（scheduler_execution.State）</text>
<rect x="1024" y="112" width="532" height="524" rx="14" fill="none" stroke="#b45309" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="1040" y="136" font-size="13.5" fill="#b45309" font-weight="600" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">任务行与重试（ScheduledJob / JobStatus）</text>
<rect x="44" y="656" width="1512" height="206" rx="14" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="60" y="680" font-size="13.5" fill="#334155" font-weight="600" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">关键不变量（正确性由什么保证）</text>
<rect x="66" y="300" width="140" height="64" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
<text x="136.0" y="337.0" font-size="15.5" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">周期到期 / 手动触发</text>
<rect x="256" y="300" width="150" height="64" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.3"/>
<text x="331.0" y="330" font-size="15.5" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">Claimed · 领取</text>
<text x="331.0" y="352" font-size="11.5" fill="#64748b" font-weight="normal" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">执行行已插入</text>
<rect x="470" y="300" width="150" height="64" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.3"/>
<text x="545.0" y="330" font-size="15.5" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">Dispatched · 受理</text>
<text x="545.0" y="352" font-size="11.5" fill="#64748b" font-weight="normal" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">Worker 已确认入队</text>
<rect x="700" y="196" width="220" height="64" rx="10" fill="#e7f8ec" stroke="#16a34a" stroke-width="1.3"/>
<text x="810.0" y="226" font-size="15.5" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">Succeeded · 成功</text>
<text x="810.0" y="248" font-size="11.5" fill="#64748b" font-weight="normal" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">回调 IsSuccess=true</text>
<rect x="700" y="300" width="220" height="64" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
<text x="810.0" y="330" font-size="15.5" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">Failed · 失败</text>
<text x="810.0" y="352" font-size="11.5" fill="#64748b" font-weight="normal" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">异常 / 超时 / 不可达</text>
<rect x="700" y="444" width="220" height="64" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.3"/>
<text x="810.0" y="474" font-size="15.5" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">Cancelled · 人工终止</text>
<text x="810.0" y="496" font-size="11.5" fill="#64748b" font-weight="normal" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">kill：先终结再通知取消</text>
<line x1="206" y1="332" x2="254" y2="332" stroke="#0f766e" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="406" y1="332" x2="468" y2="332" stroke="#0f766e" stroke-width="2" marker-end="url(#arrowhead)"/>
<text x="437" y="322" font-size="10.8" fill="#475569" font-weight="600" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">受理确认</text>
<line x1="620" y1="318" x2="698" y2="246" stroke="#0f766e" stroke-width="2" marker-end="url(#arrowhead)"/>
<text x="648" y="238" font-size="10.8" fill="#475569" font-weight="600" text-anchor="end" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">回调成功</text>
<line x1="620" y1="340" x2="698" y2="332" stroke="#0f766e" stroke-width="2" marker-end="url(#arrowhead)"/>
<path d="M306,364 C 420,430 560,420 698,350" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowhead)"/>
<text x="505" y="432" font-size="10.8" fill="#475569" font-weight="600" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">30s 超时（视为未送达）</text>
<path d="M560,364 C 560,470 640,474 698,474" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowhead)"/>
<text x="604" y="510" font-size="10.8" fill="#475569" font-weight="600" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">kill 先终结再通知</text>
<path d="M700,340 C 540,600 420,600 366,364" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowhead)"/>
<text x="470" y="624" font-size="10.8" fill="#475569" font-weight="600" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">失败退避：新建执行行 attempt+1（最多 5 次）</text>
<text x="704" y="392" font-size="10.8" fill="#b45309" font-weight="600" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">重试耗尽 → 任务 Dead（见右图）</text>
<rect x="1080" y="180" width="170" height="60" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.3"/>
<text x="1165.0" y="215.0" font-size="15.5" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">Normal · 正常</text>
<rect x="1330" y="180" width="170" height="60" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.3"/>
<text x="1415.0" y="215.0" font-size="15.5" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">Paused · 暂停</text>
<rect x="1330" y="340" width="170" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
<text x="1415.0" y="375.0" font-size="15.5" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">Dead · 死信隔离</text>
<line x1="1252" y1="194" x2="1328" y2="194" stroke="#0f766e" stroke-width="2" marker-end="url(#arrowhead)"/>
<text x="1290" y="186" font-size="10.8" fill="#475569" font-weight="600" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">pause</text>
<line x1="1328" y1="226" x2="1252" y2="226" stroke="#0f766e" stroke-width="2" marker-end="url(#arrowhead)"/>
<text x="1290" y="244" font-size="10.8" fill="#475569" font-weight="600" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">resume</text>
<path d="M1165,240 C 1180,312 1270,360 1328,368" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrowhead)"/>
<text x="1240" y="320" font-size="10.8" fill="#475569" font-weight="600" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">重试耗尽（最多 5 次）</text>
<path d="M1330,372 C 1150,478 1040,320 1086,244" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowhead)"/>
<text x="1110" y="440" font-size="10.8" fill="#475569" font-weight="600" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">release 人工放行</text>
<text x="1064" y="494" font-size="12" fill="#475569" font-weight="600" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">退避阶梯：1s → 2s → 4s → 8s → 16s → 60s 封顶</text>
<text x="1064" y="518" font-size="12" fill="#475569" font-weight="normal" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">失败最多 MaxRetryCount=5 次，用尽后任务转 Dead，不再自动触发</text>
<text x="1064" y="542" font-size="12" fill="#475569" font-weight="normal" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">Dead 只能 release 放行：TryCount 归零、NextRunTime 重排</text>
<text x="1064" y="564" font-size="12" fill="#475569" font-weight="normal" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">无节点不建执行行：DeferCycleAsync 只推周期锚点，不计重试</text>
<text x="1064" y="590" font-size="12" fill="#475569" font-weight="normal" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">成功：TryCount 归零、LastRunTime 更新、NextRunTime 推向下周期</text>
<text x="1064" y="614" font-size="12" fill="#b45309" font-weight="600" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">超时兜底：Claimed 30s → Failed；Dispatched 10min → Failed（读表接管）</text>
<rect x="66" y="686" width="350" height="156" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="82" y="714" font-size="14.5" fill="#0f172a" font-weight="600" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">唯一键</text>
<text x="82" y="744" font-size="12" fill="#475569" font-weight="normal" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">ExecutionKey = jobId:period:attempt</text>
<text x="82" y="768" font-size="12" fill="#475569" font-weight="normal" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">同一周期同一次尝试只有一行执行记录</text>
<text x="82" y="796" font-size="11" fill="#94a3b8" font-weight="normal" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">崩溃/重复投递也不会多出一行</text>
<rect x="440" y="686" width="350" height="156" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="456" y="714" font-size="14.5" fill="#0f172a" font-weight="600" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">CAS 终结</text>
<text x="456" y="744" font-size="12" fill="#475569" font-weight="normal" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">回调按“当前状态”条件更新</text>
<text x="456" y="768" font-size="12" fill="#475569" font-weight="normal" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">重复回调只有一条成功，其余直接忽略</text>
<text x="456" y="796" font-size="11" fill="#94a3b8" font-weight="normal" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">“已终结”的行不会被二次覆盖</text>
<rect x="814" y="686" width="350" height="156" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="830" y="714" font-size="14.5" fill="#0f172a" font-weight="600" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">租约不承载正确性</text>
<text x="830" y="744" font-size="12" fill="#475569" font-weight="normal" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">scheduler_master 只减少无效扫描</text>
<text x="830" y="768" font-size="12" fill="#475569" font-weight="normal" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">重复扫描不会重复触发，靠 CAS + 唯一键</text>
<text x="830" y="796" font-size="11" fill="#94a3b8" font-weight="normal" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">租约抖动只多一轮空扫描</text>
<rect x="1188" y="686" width="350" height="156" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="1204" y="714" font-size="14.5" fill="#0f172a" font-weight="600" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">账本接管</text>
<text x="1204" y="744" font-size="12" fill="#475569" font-weight="normal" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">超时兜底扫的是执行表</text>
<text x="1204" y="768" font-size="12" fill="#475569" font-weight="normal" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">换主 / 重启后在途执行有人接手</text>
<text x="1204" y="796" font-size="11" fill="#94a3b8" font-weight="normal" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">不再依赖进程内存</text>
<text x="60" y="886" font-size="12" fill="#64748b" font-weight="600" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">取值：ExecutionState 1..5（Claimed / Dispatched / Succeeded / Failed / Cancelled）· JobStatus Normal=0 / Paused=1 / Dead=3</text>
</svg></body></html>
