<text x="78" y="428" font-size="12.5" fill="#475569" font-weight="normal" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">队列 4096、消费 4 线程；同一周期只有一次领取能成功</text>
